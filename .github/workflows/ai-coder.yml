name: AI Autonomous Code Iteration

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  iterate:
    if: "!github.event.issue.pull_request"
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 執行 AI 迭代與改動分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > run_ai.js
          const fs = require("fs");
          const https = require("https");

          function postJson(hostname, path, headers, payload) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname,
                path,
                method: "POST",
                headers: Object.assign({ "Content-Type": "application/json" }, headers)
              }, (res) => {
                let body = "";
                res.on("data", chunk => body += chunk);
                res.on("end", () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    try { resolve(JSON.parse(body)); } catch(e) { reject(e); }
                  } else {
                    reject(new Error(`HTTP ${res.statusCode}: ${body}`));
                  }
                });
              });
              req.on("error", reject);
              req.write(JSON.stringify(payload));
              req.end();
            });
          }

          async function callGemini(prompt) {
            const key = process.env.GEMINI_API_KEY;
            if (!key) throw new Error("未設定 GEMINI_API_KEY");
            const models = ["gemini-3.6-flash"];
            for (const m of models) {
              try {
                const res = await postJson(
                  "generativelanguage.googleapis.com",
                  `/v1beta/models/${m}:generateContent?key=${key}`,
                  {},
                  { contents: [{ parts: [{ text: prompt }] }] }
                );
                return { text: res.candidates[0].content.parts[0].text, model: `Gemini (${m})` };
              } catch (e) {
                console.warn(`Gemini ${m} 失敗:`, e.message);
              }
            }
            throw new Error("Gemini 端點連線失敗");
          }

          async function main() {
            if (!fs.existsSync("index.html")) throw new Error("找不到 index.html");
            const currentHtml = fs.readFileSync("index.html", "utf-8");
            const title = process.env.ISSUE_TITLE || "";
            const body = process.env.ISSUE_BODY || "";

            const prompt = `你是一個專業前端架構師與 UI/UX 設計師。
          修改需求：
          標題：${title}
          內容：${body}

          請依據需求審視並重構現有的 index.html。
          規範：
          1. 嚴格保留現有 HTML 中已有的客製化資訊與架構。
          2. 回傳乾淨的 JSON 格式（嚴禁包含 markdown 代碼框標記）：
          {
            "summary": "條列繁體中文說明具體優化了哪些樣式或邏輯",
            "new_html": "完整的 HTML 代碼"
          }

          目前的 index.html：
          ${currentHtml}`;

            const result = await callGemini(prompt);

            const cleanJson = result.text.replace(/```json/gi, "").replace(/```/g, "").trim();
            const parsed = JSON.parse(cleanJson);

            fs.writeFileSync("index.html", parsed.new_html.trim());
            fs.writeFileSync("report.txt", `### 執行引擎\n- **${result.model}**\n\n### 代碼審查與改動清單\n${parsed.summary}`);
            console.log("迭代成功！模型：", result.model);
          }

          main().catch(err => {
            console.error("執行失敗：", err);
            process.exit(1);
          });
          EOF
          node run_ai.js

      - name: 推送更新代碼
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: 根據 Issue #${{ github.event.issue.number }} 迭代更新"
          git push

      - name: 回覆 Issue 詳細報告
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report.txt')) {
              const report = fs.readFileSync('report.txt', 'utf-8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
