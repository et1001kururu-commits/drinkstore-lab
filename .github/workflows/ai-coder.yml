name: AI Autonomous Coder

on:
  issues:
    types: [opened, edited]

jobs:
  modify-code:
    if: github.event.issue.title != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 安裝 Google AI 官方套件
        run: npm install @google/genai

      - name: 執行 AI 迭代與改動分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
          const fs = require("fs");
          const { GoogleGenAI } = require("@google/genai");

          async function main() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            const currentHtml = fs.readFileSync("index.html", "utf-8");
            const title = process.env.ISSUE_TITLE || "";
            const body = process.env.ISSUE_BODY || "";

            const prompt = `你是一個專業前端架構師。
            修改需求：
            標題：${title}
            內容：${body}

            請依據需求修改現有的 index.html。
            重要規範：
            1. 必須嚴格保留現有 HTML 中使用者自行設定的文字、品名、地址與價格，不得覆蓋還原。
            2. 回傳格式必須為合法 JSON 格式，嚴禁任何 markdown 標籤（不要寫 \`\`\`json）：
            {
              "summary": "以 2-3 點條列繁體中文說明具體改了哪些部分",
              "new_html": "修改後的完整 HTML 代碼"
            }

            目前的 index.html：
            ${currentHtml}`;

            let text = "";
            const models = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-1.5-pro"];
            let usedModel = "";

            for (const model of models) {
              try {
                const response = await ai.models.generateContent({
                  model: model,
                  contents: prompt,
                });
                text = response.text;
                usedModel = model;
                break;
              } catch (e) {
                console.warn(`嘗試 ${model} 失敗，切換下一組：`, e.message || e);
              }
            }

            if (!text) throw new Error("所有 Gemini 模型端點調用均失敗，請確認 API 金鑰是否有效。");

            const cleanJson = text.replace(/```json/g, "").replace(/```/g, "").trim();
            const parsed = JSON.parse(cleanJson);

            fs.writeFileSync("index.html", parsed.new_html.trim());
            fs.writeFileSync("report.txt", `### 執行模型\n- **Gemini (${usedModel})**\n\n### 改動項目清單\n${parsed.summary}`);
            console.log("迭代成功！模型：", usedModel);
          }

          main().catch(err => {
            console.error("執行失敗：", err);
            process.exit(1);
          });
          '

      - name: 推送更新代碼
        run: |
          git config --global user.name "AI-Auto-Coder"
          git config --global user.email "ai-coder@github.com"
          git add index.html
          git commit -m "AI 依據 Issue #${{ github.event.issue.number }} 自動迭代" || exit 0
          git push

      - name: 回覆 Issue 詳細報告
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('report.txt') ? fs.readFileSync('report.txt', 'utf-8') : '無改動細節報告';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 **AI 迭代任務已完成並發布上線！**\n\n${report}\n\n---\n*請等待約 1 分鐘後重新整理 GitHub Pages 頁面檢驗成果。*`
            })
